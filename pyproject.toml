[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abacus-excel"
version = "1.0.0"
description = "Local Excel automation framework with Chinese mathematical heritage"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "xlwt>=1.3.0",
    "pandas>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "fastmcp>=0.4.0",
    "portalocker>=2.7.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
abacus = "abacus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/abacus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
